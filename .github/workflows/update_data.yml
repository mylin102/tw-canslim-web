name: 增量交易系統自動更新

on:
  schedule:
    # 台灣時間 18:00 (收盤後) = UTC 10:00
    - cron: '0 10 * * 1-5' # UTC 10:00 = 台灣 18:00, 週一至週五
  workflow_dispatch: # 允許手動觸發

concurrency:
  group: publish-surface-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  incremental-update:
    runs-on: ubuntu-latest
    # 2026-10-05: measured directly (run 37276258903, cut off at exactly
    # 75min): the revenue feature pipeline processes ~1962 stocks at ~2s each
    # (most fall through the full TEJ -> FinMind -> yfinance fallback chain --
    # FinMind has real coverage gaps for plenty of non-ETF stocks too, not
    # just ETFs) = ~65min for that step alone, on top of ~22min for
    # everything else in run(). ~90min needed; 110min gives headroom. This is
    # a stopgap, not a fix -- the previous 30min budget was sized for when
    # FinMind's login bug (fixed in 3a15d12) made every FinMind call fail
    # instantly instead of actually trying. Revenue-pipeline throughput
    # itself (e.g. rotating it across days like the CANSLIM core/rotation
    # split, or dropping the now-mostly-redundant yfinance proxy tier) is a
    # separate follow-up.
    timeout-minutes: 110
    
    steps:
      - name: 🛠️ 檢查程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 取得完整歷史記錄
    
      - name: 🐍 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
    
      - name: 📦 安裝依賴
        run: |
          pip install -r requirements.txt
          pip install yfinance pandas numpy requests

      - name: ♻️ 還原 rotation state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROTATION_STATE_ARTIFACT: rotation-state-${{ github.ref_name }}
        run: |
          mkdir -p .orchestration .orchestration-artifact
          RESTORED=0
          for RUN_ID in $(gh run list --branch "${{ github.ref_name }}" --json databaseId -L 20 --jq '.[] | select((.databaseId|tostring) != env.GITHUB_RUN_ID) | .databaseId'); do
            rm -rf .orchestration-artifact/*
            if gh run download "$RUN_ID" --name "$ROTATION_STATE_ARTIFACT" --dir .orchestration-artifact 2>/dev/null; then
              RESTORED_FILE=$(find .orchestration-artifact -name rotation_state.json | head -n 1)
              if [ -n "$RESTORED_FILE" ]; then
                cp "$RESTORED_FILE" .orchestration/rotation_state.json
                echo "Restored rotation state from run $RUN_ID"
                RESTORED=1
                break
              fi
            fi
          done
          if [ "$RESTORED" -eq 0 ]; then
            echo "No prior rotation state artifact found"
          fi
    
      - name: 📦 安裝依賴項
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔄 執行增量更新
        run: |
          echo "開始每日發布流程..."
          echo "步驟 1: 更新 CANSLIM 資料與 Phase 4 publish bundle..."
          TEJ_API_KEY=${{ secrets.TEJ_API_KEY }} FINMIND_API_TOKEN=${{ secrets.FINMIND_TOKEN }} python export_canslim.py
          echo "✅ 每日發布完成！"

      - name: ⏱️ 驗證 runtime budget
        env:
          RUNTIME_BUDGET_NOTE: ${{ vars.RUNTIME_BUDGET_NOTE }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(".orchestration/runtime_budget.json").read_text(encoding="utf-8"))
          required = {"elapsed_seconds", "retry_attempts", "retry_failures", "provider_wait_seconds"}
          missing = sorted(required.difference(payload))
          if missing:
              raise SystemExit(f"runtime_budget missing keys: {missing}")
          note = os.environ.get("RUNTIME_BUDGET_NOTE", "").strip()
          # 2026-10-05: raised again, 4200s -> 6300s, alongside the job's
          # 75min -> 110min timeout-minutes bump (see that field's comment
          # for the measured numbers), keeping a ~5min buffer under the hard
          # job timeout.
          if payload["elapsed_seconds"] > 6300 and not note:
              raise SystemExit(
                  f"elapsed_seconds {payload['elapsed_seconds']} exceeds 6300 without RUNTIME_BUDGET_NOTE"
              )
          print(payload)
          PY
    
      - name: 📊 檢查結果
        run: |
          echo "檢查生成的檔案..."
          ls -la docs/*.json docs/*.html 2>/dev/null | head -20
          python - <<'PY'
          import json
          from pathlib import Path

          for path_str in (
              "docs/data.json",
              "docs/data_base.json",
              "docs/stock_index.json",
              "docs/update_summary.json",
          ):
              path = Path(path_str)
              payload = json.loads(path.read_text(encoding="utf-8"))
              print(f"✅ {path_str}: artifact_kind={payload.get('artifact_kind')} run_id={payload.get('run_id')}")
          PY

      - name: 📦 上傳 rotation state artifact
        # 2026-10-06: was if: always(), which let a killed/canceled run (e.g.
        # a timeout-minutes kill) upload rotation_state.json reflecting
        # symbols it marked complete in memory but never actually committed
        # to docs/data.json (the "📤 提交更新" step never runs on a killed
        # job -- no step can, after a hard job-level timeout). The next run's
        # "♻️ 還原 rotation state" step would then restore that artifact and
        # skip those symbols as "already done this batch", permanently
        # freezing their real data (confirmed: 6139/6153 showed 🟢今日
        # freshness while 三大法人買賣超 was still from April) until rotation
        # happened to cycle back around to them. Only upload after a
        # successful run, so the artifact never gets ahead of what's
        # actually committed.
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-state-${{ github.ref_name }}
          path: .orchestration/rotation_state.json
          if-no-files-found: warn
    
      - name: 📤 提交更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 添加所有更新的檔案
          git add docs/data.json docs/data_base.json docs/data_light.json docs/data.json.gz
          git add docs/stock_index.json docs/update_summary.json
          git add docs/etf_regime.json
          git add docs/api/*.json
          git add data/leaders.json
          git add .orchestration/rotation_state.json
          git add .orchestration/feature_pipeline_state.json 2>/dev/null || true
          git add docs/incremental_dashboard.html docs/test_github_pages.html 2>/dev/null || true
          
          # 提交
          git commit -m "📈 自動更新: CANSLIM資料發布 $(date +'%Y-%m-%d %H:%M')" || echo "沒有變更可提交"
          
          # 推送
          git push
